name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck runs first: it is the fastest signal and catches the class of
      # bug that `vite build` silently strips out.
      - name: Typecheck web
        run: npm run typecheck -w @vivly/web

      - name: Typecheck worker
        run: npm run typecheck -w rivly-worker

      - name: Test web
        run: npm run test -w @vivly/web

      - name: Test worker
        run: npm run test -w rivly-worker

      - name: Build web
        run: npm run build -w @vivly/web
